<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Requisição de Compras • Delícia Gourmet</title>

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#1e40af">
<link rel="manifest" href="/manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
/* =========================================================
   RESET + BASE
========================================================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  touch-action: manipulation;
}

body {
  font-family: 'Inter', Arial, sans-serif;
  background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
  display: flex;
  justify-content: center;
  padding: 14px;
  color: #0f172a;
}

/* =========================================================
   CONTAINER PRINCIPAL
========================================================= */
.container {
  background: #ffffff;
  border-radius: 24px;
  box-shadow:
    0 10px 25px rgba(0,0,0,0.08),
    0 30px 60px rgba(0,0,0,0.08);
  max-width: 520px;
  width: 100%;
  padding: 20px 18px 22px;
  position: relative;
}

/* =========================================================
   TOPO / HEADER
========================================================= */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.topbar h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

/* BOTÃO LOGOUT */
.btn-logout {
  width: auto;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 800;
  border-radius: 999px;
  border: none;
  background: #fee2e2;
  color: #991b1b;
  cursor: pointer;
  transition: all .2s ease;
}

.btn-logout:hover {
  background: #fecaca;
}

/* =========================================================
   FORMULÁRIOS
========================================================= */
label {
  display: block;
  margin-top: 14px;
  margin-bottom: 4px;
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
}

input,
select,
textarea {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #cbd5e1;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  background: #ffffff;
  transition: all .15s ease;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}

input[readonly] {
  background: #f1f5f9;
  color: #334155;
}

textarea {
  min-height: 90px;
  resize: none;
}

/* =========================================================
   BOTÕES
========================================================= */
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 16px;
  border: none;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  position: relative;
  transition: all .2s ease;
}

button:active {
  transform: scale(0.98);
}

/* PRIMÁRIO */
.btn-primary {
  background: linear-gradient(180deg, #2563eb, #1e40af);
  color: #ffffff;
}

.btn-primary:hover {
  filter: brightness(1.05);
}

/* MUTED */
.btn-muted {
  background: #e5e7eb;
  color: #0f172a;
}

.btn-muted:hover {
  background: #d1d5db;
}

/* LOADING OVERLAY */
button.loading {
  pointer-events: none;
}

button.loading::after {
  content: "Enviando…";
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  font-weight: 800;
}

/* =========================================================
   CAMERA / LEITOR
========================================================= */
#camera {
  width: 100%;
  height: 260px;
  margin-top: 14px;
  border-radius: 18px;
  overflow: hidden;
  background: #000;
  position: relative;
}

#camera.hidden {
  display: none;
}

#camera video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}


#camera video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#codigoLido {
  margin-top: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  color: #2563eb;
}

/* =========================================================
   BADGE / UNIDADE
========================================================= */
.badge {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 800;
  border-radius: 999px;
  background: #e0f2fe;
  color: #0369a1;
}

/* =========================================================
   BUSCA POR NOME (LISTA)
========================================================= */
#listaProdutos {
  margin-top: 6px;
}

.item {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 12px;
  margin-top: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s ease;
}

.item:hover {
  background: #e2e8f0;
}

/* =========================================================
   HISTÓRICO
========================================================= */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 13px;
  border-radius: 14px;
  overflow: hidden;
}

th, td {
  border: 1px solid #e5e7eb;
  padding: 8px;
  text-align: center;
}

th {
  background: #f1f5f9;
  font-weight: 800;
}

tbody tr:nth-child(even) {
  background: #f8fafc;
}

/* BOTÃO EXCLUIR */
.btn-delete {
  background: #fee2e2;
  color: #991b1b;
  border: none;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.btn-delete:hover {
  background: #fecaca;
}

/* =========================================================
   UTILIDADES
========================================================= */
.hidden {
  display: none !important;
}
#camera {
  min-height: 260px;
}

</style>
</head>

<body>
<div class="container">

<div class="topbar">
  <h1>📋 Requisição</h1>
<button class="btn-logout" id="btnLogout">Sair</button>
</div>

<!-- LOGIN -->
<div id="loginArea">
  <label>Usuário</label>
  <input id="usuario">
  <label>Senha</label>
  <input id="senha" type="password">
  <button class="btn-primary" id="btnLogin">Entrar</button>
</div>

<!-- APP -->
<div id="appArea" class="hidden">

<label>Setor</label>
<select id="setor">
  <option>Cozinha</option>
  <option>Limpeza</option>
  <option>Bar</option>
</select>

<label></label>
<input id="barcode" placeholder="Digite ou escaneie">
<label>Modo de busca</label>
<select id="modoBusca">
  <option value="barcode">Código de Barras</option>
  <option value="nome">Nome do produto</option>
  <option value="id">ID do produto</option>
</select>

<div id="buscaNome" class="hidden">
  <label>Buscar por nome</label>
  <input id="buscaProdutoNome" placeholder="Digite o nome do produto">
  <div id="listaProdutos"></div>
</div>

<div id="buscaId" class="hidden">
  <label>Buscar por ID</label>
  <input id="buscaProdutoId" type="number" inputmode="numeric" placeholder="Digite o ID">
</div>

<button class="btn-muted" id="btnManual">Buscar manual</button>
<button class="btn-primary" id="btnOpenCamera">Abrir câmera</button>
<button class="btn-muted hidden" id="btnCloseCamera">Fechar câmera</button>

<div id="camera"></div>

<div id="codigoLido"></div>

<label>Produto</label>
<input id="produto" readonly>

<div id="unidadeBox"></div>

<label>Quantidade</label>
<input type="number" id="quantidade" min="1">

<label>Observações</label>
<textarea id="observacoes"></textarea>

<button class="btn-primary" id="btnEnviar">Enviar requisição</button>

<h3 style="margin-top:20px">Histórico (7 dias)</h3>
<table>
<thead>
<tr>
<th>Produto</th><th>Qtd</th><th>Status</th><th>Ação</th>
</tr>
</thead>
<tbody id="historico"></tbody>
</table>

</div>

<audio id="beep">
<source src="data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQwAAAAA">
</audio>

</div>
<!-- 🔥 SUBSTITUI TODO SEU SCRIPT POR ESSE -->

<script>
const sb = supabase.createClient(
 "https://mybsriouiwqsdufujbsc.supabase.co",
 "sb_publishable_AUyBEIVCAMUoXwDKUmlqSw_v8EY8rVN"
);

let usuarioLogado = JSON.parse(localStorage.getItem("usuario"));

let produtoSelecionado = null;

/* ================= LOGIN ================= */
btnLogin.onclick = async () => {
  const { data } = await sb.from("usuarios")
    .select("*")
    .eq("usuario", usuario.value)
    .eq("senha", senha.value)
    .eq("ativo", true)
    .single();

  if (!data) return alert("Login inválido");

  localStorage.setItem("usuario", JSON.stringify(data.usuario));
  init();
};

/* ================= INIT ================= */
async function init(){
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  btnLogout.classList.remove("hidden");

  carregarHistorico();
}
if(usuarioLogado) init();

/* ================= LOGOUT ================= */
btnLogout.onclick = () => {
  localStorage.removeItem("usuario");
  location.reload();
};

/* ================= BUSCA PRODUTO ================= */
buscaProdutoNome.onkeyup = async () => {

  const q = buscaProdutoNome.value.trim().toUpperCase();

  if(q.length < 2){
    listaProdutos.innerHTML = "";
    return;
  }

  const { data } = await sb
    .from("produtos_para_requisicao")
    .select("*")
    .ilike("nome", `%${q}%`)
    .limit(10);

  listaProdutos.innerHTML = "";

  (data || []).forEach(p => {
    listaProdutos.insertAdjacentHTML("beforeend", `
      <div class="item" onclick="selecionarProduto(${p.id}, '${p.nome}', '${p.unidade || "UN"}')">
        ${p.nome}
      </div>
    `);
  });
};

/* ================= SELECIONAR ================= */
function selecionarProduto(id, nome, unidade){
  produto.value = nome;
  produtoSelecionado = { id, nome, unidade };

  unidadeBox.innerHTML = `<div class="badge">${unidade}</div>`;
  listaProdutos.innerHTML = "";
}

/* ================= ENVIAR ================= */
btnEnviar.onclick = async () => {

  if(!produto.value || !quantidade.value){
    return alert("Preencha produto e quantidade");
  }

  let produtoNome = produto.value.trim().toUpperCase();

  let produtoId = produtoSelecionado?.id || null;
  let unidade = produtoSelecionado?.unidade || "UN";

  /* 🔥 SE NÃO EXISTIR → CRIA */
  if(!produtoId){

    const { data: novo } = await sb
      .from("produtos_para_requisicao")
      .insert({
        nome: produtoNome,
        unidade: unidade
      })
      .select()
      .single();

    produtoId = novo.id;
  }

  /* 🔥 SALVA REQUISIÇÃO */
  await sb.from("requisicoes").insert({
    usuario: usuarioLogado,
    setor: setor.value,
    produto: produtoNome,
    produto_id: produtoId,
    quantidade: Number(quantidade.value),
    unidade: unidade,
    observacoes: observacoes.value,
    status: "PENDENTE"
  });

  alert("✅ Requisição enviada!");

  limpar();
  carregarHistorico();
};

/* ================= LIMPAR ================= */
function limpar(){
  produto.value = "";
  quantidade.value = "";
  observacoes.value = "";
  unidadeBox.innerHTML = "";
  listaProdutos.innerHTML = "";
  produtoSelecionado = null;
}

/* ================= HISTÓRICO ================= */
async function carregarHistorico(){

  historico.innerHTML = "";

  const seteDias = new Date(Date.now() - 7*86400000).toISOString();

  const { data } = await sb
    .from("requisicoes")
    .select("*")
    .eq("usuario", usuarioLogado)
    .gte("created_at", seteDias)
    .order("created_at", { ascending:false });

  (data || []).forEach(r => {

    historico.insertAdjacentHTML("beforeend", `
      <tr>
        <td>${r.produto}</td>
        <td>${r.quantidade}</td>
        <td>${r.status}</td>
        <td>-</td>
      </tr>
    `);

  });
}
</script>
</body>
</html>
