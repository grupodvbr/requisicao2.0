<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Requisição de produtos</title>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter;
background:#f1f5f9;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:500px;
background:#fff;
padding:20px;
border-radius:12px;
margin:10px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:20px;
}

label{
font-weight:700;
font-size:14px;
margin-top:10px;
display:block;
}

input,select,textarea{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d1d5db;
margin-top:5px;
font-size:14px;
}

textarea{
height:80px;
}

.unidades{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.unidades button{
flex:1;
padding:10px;
border-radius:20px;
border:2px solid #3b82f6;
background:#fff;
font-weight:700;
cursor:pointer;
}

.unidades button.active{
background:#3b82f6;
color:#fff;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-weight:800;
margin-top:10px;
cursor:pointer;
}

.btn-primary{
background:#2f86d6;
color:#fff;
}

.btn-danger{
background:#ef4444;
color:#fff;
}

table{
width:100%;
margin-top:15px;
border-collapse:collapse;
font-size:12px;
}

th,td{
border:1px solid #e5e7eb;
padding:6px;
text-align:center;
}

#listaProdutos{
background:#fff;
border:1px solid #ddd;
border-radius:8px;
margin-top:5px;
max-height:150px;
overflow:auto;
}

.item{
padding:10px;
cursor:pointer;
font-weight:600;
}

.item:hover{
background:#f1f5f9;
}
</style>
</head>

<body>

<div class="container">

<h1>Requisição de produtos</h1>

<label>Solicitante</label>
<select id="solicitante">
<option>Selecione o solicitante</option>
<option>João</option>
<option>Maria</option>
</select>

<label>Setor</label>
<select id="setor">
<option>Cozinha</option>
<option>Bar</option>
<option>Limpeza</option>
</select>

<label>Produto</label>
<input id="produto" placeholder="Digite o produto">
<div id="listaProdutos"></div>

<label>Quantidade</label>
<input id="quantidade" placeholder="0,00">

<label>Unidade de Medida</label>
<div class="unidades">
<button onclick="setUnidade('UN')" id="uUN">UN.</button>
<button onclick="setUnidade('PC')" id="uPC">PC.</button>
<button onclick="setUnidade('L')" id="uL">L.</button>
<button onclick="setUnidade('KG')" id="uKG">KG.</button>
<button onclick="setUnidade('CX')" id="uCX">CX.</button>
</div>

<label>Observações</label>
<textarea id="obs" placeholder="Observações gerais"></textarea>

<button class="btn btn-primary" onclick="enviar()">ENVIAR ITEM</button>
<button class="btn btn-danger" onclick="limpar()">LIMPAR HISTÓRICO</button>

<h3>Itens enviados nesta sessão:</h3>

<table>
<thead>
<tr>
<th>Produto</th>
<th>Unidade</th>
<th>Qtd</th>
<th>Setor</th>
<th>Hora</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

</div>

<script>
const sb = supabase.createClient(
 "https://mybsriouiwqsdufujbsc.supabase.co",
 "sb_publishable_AUyBEIVCAMUoXwDKUmlqSw_v8EY8rVN"
);

let unidade = "UN";
let produtosCache = [];

/* ===== UNIDADE ===== */
function setUnidade(u){
  unidade = u;
  document.querySelectorAll(".unidades button").forEach(b=>b.classList.remove("active"));
  document.getElementById("u"+u).classList.add("active");
}

/* ===== MASCARA QUANTIDADE ===== */
quantidade.oninput = () => {
  let v = quantidade.value.replace(/\D/g,'');
  v = (Number(v)/100).toFixed(2);
  quantidade.value = v;
};

/* ===== BUSCA ===== */
produto.onkeyup = async () => {

  const q = produto.value.trim().toUpperCase();

  if(q.length < 2){
    listaProdutos.innerHTML="";
    return;
  }

  const { data } = await sb
  .from("produtos_para_requisicao")
  .select("*")
  .ilike("nome", `%${q}%`)
  .limit(10);

  produtosCache = data || [];

  listaProdutos.innerHTML = "";

  produtosCache.forEach(p=>{
    listaProdutos.innerHTML += `
    <div class="item" onclick="selectProduto('${p.nome}')">
      ${p.nome}
    </div>`;
  });
};

/* ===== SELECT ===== */
function selectProduto(nome){
  produto.value = nome;
  listaProdutos.innerHTML = "";

  // 🔥 pergunta unidade
  setTimeout(()=>{
    const u = prompt("Qual unidade? (UN, KG, L, CX, PC)", unidade);
    if(u) setUnidade(u.toUpperCase());
  },100);
}

/* ===== ENVIAR ===== */
async function enviar(){

  if(!produto.value || !quantidade.value){
    alert("Preencha produto e quantidade");
    return;
  }

  const nome = produto.value.trim().toUpperCase();

  // 🔥 cria produto se não existir
  const { data: existente } = await sb
  .from("produtos_para_requisicao")
  .select("*")
  .eq("nome", nome)
  .single();

  let produto_id;

  if(!existente){
    const { data: novo } = await sb
    .from("produtos_para_requisicao")
    .insert({ nome })
    .select()
    .single();

    produto_id = novo.id;
  }else{
    produto_id = existente.id;
  }

  // 🔥 salva requisição
  await sb.from("requisicoes").insert({
    produto:nome,
    produto_id,
    quantidade:Number(quantidade.value),
    unidade,
    setor:setor.value,
    usuario:solicitante.value,
    status:"ENVIADO"
  });

  adicionarTabela(nome);
  limparCampos();
}

/* ===== TABELA LOCAL ===== */
function adicionarTabela(nome){
  const hora = new Date().toLocaleTimeString();

  tabela.innerHTML += `
  <tr>
    <td>${nome}</td>
    <td>${unidade}</td>
    <td>${quantidade.value}</td>
    <td>${setor.value}</td>
    <td>${hora}</td>
    <td>Enviado</td>
  </tr>`;
}

/* ===== LIMPAR ===== */
function limpar(){
  tabela.innerHTML="";
}

function limparCampos(){
  produto.value="";
  quantidade.value="";
  obs.value="";
}
</script>

</body>
</html>
